<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Cloud-Based EventConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">🎟️ EventConnect</div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search events...">
    <div class="nav-right">
      <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">⚙️ Admin</a>
      <span id="userName">👤</span>
      <button class="btn-logout" onclick="logoutUser()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="welcome" id="welcomeText">Hello! 🎟️</h1>

    <div class="chips" id="chips"></div>

    <div class="section-head"><h2>🎉 Upcoming Events</h2></div>
    <div class="grid" id="eventsGrid"></div>

    <section class="reg-section">
      <div class="section-head"><h2>💌 My Registrations</h2></div>
      <ul class="reg-list" id="regList"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
